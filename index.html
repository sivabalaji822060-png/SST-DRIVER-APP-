<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SST Driver App</title>
<style>
:root{--navy:#061a2d;--blue:#103f73;--bg:#eef3f8;--card:#fff;--muted:#64748b;--green:#0b7a4b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#132033}
header{background:var(--navy);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:3}header b{font-size:21px}header small{display:block;opacity:.8;margin-top:3px}
main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000012}
h2,h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;display:block;margin:2px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d4dce5;border-radius:11px;font-size:16px;background:#fff}
button{border:0;border-radius:11px;padding:13px 15px;font-size:15px;font-weight:700;background:var(--blue);color:white}button.alt{background:#e7eef6;color:#123}button.danger{background:#a32929}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs .off{background:#dce6f0;color:#334155}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f3f7fb;padding:12px;border-radius:12px}.metric span{font-size:12px;color:var(--muted);display:block}.metric b{font-size:19px}
.good{color:var(--green)}.row{border-top:1px solid #e5e7eb;padding:12px 0}.row:first-child{border-top:0}.tiny{font-size:12px;color:var(--muted)}
#login{min-height:100vh;background:var(--navy);display:flex;align-items:center;padding:24px}.loginbox{background:white;border-radius:22px;padding:22px;width:100%;max-width:440px;margin:auto}
#app{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.status{font-size:13px;margin-top:9px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="login"><div class="loginbox"><h2>SST Driver App</h2><p>Cloud Login</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label style="margin-top:12px">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" style="width:100%;margin-top:16px">Login</button><div id="loginStatus" class="status">Firebase Authentication</div></div></section>

<section id="app"><header><b>Sri Selvam Tours and Travels</b><small>SST Driver Account</small></header><main>
<div class="card"><div class="grid"><div><label>Driver Name</label><input id="driver"></div><div><label>Vehicle No.</label><input id="vehicle" placeholder="TN..."></div><div><label>Date</label><input id="date" type="date"></div><div><label>Salary %</label><input id="salaryPct" type="number" value="35"></div></div></div>
<div class="tabs"><button id="localTab">Local / Apps</button><button id="outTab" class="off">Outstation</button></div>

<div id="localPanel">
<div class="card"><h3>Earnings</h3><div class="grid">
<div><label>Uber ₹</label><input class="earn" id="uber" type="number"></div><div><label>Ola ₹</label><input class="earn" id="ola" type="number"></div>
<div><label>Rapido ₹</label><input class="earn" id="rapido" type="number"></div><div><label>Namma Yatri ₹</label><input class="earn" id="namma" type="number"></div>
<div class="full"><label>Travels Local Package ₹</label><input class="earn" id="travels" type="number"></div>
</div></div>
<div class="card"><h3>Collection & Expenses</h3><div class="grid">
<div><label>Cash Collected ₹</label><input id="cash" type="number"></div><div><label>Fuel / CNG ₹</label><input id="fuel" type="number"></div>
<div class="full"><label>Other Expense ₹</label><input id="other" type="number"></div></div></div>
</div>

<div id="outPanel" style="display:none">
<div class="card"><h3>Outstation Trip</h3><div class="grid">
<div class="full"><label>Trip / Route</label><input id="route"></div><div><label>Trip Amount ₹</label><input id="tripAmount" type="number"></div>
<div><label>Cash Collected ₹</label><input id="outCash" type="number"></div><div><label>Driver Bata / Salary ₹</label><input id="bata" type="number"></div>
<div><label>Fuel ₹</label><input id="outFuel" type="number"></div><div><label>Toll ₹</label><input id="toll" type="number"></div>
<div><label>Parking ₹</label><input id="parking" type="number"></div><div><label>Permit ₹</label><input id="permit" type="number"></div>
<div class="full"><label>Other ₹</label><input id="outOther" type="number"></div></div></div>
</div>

<div class="card"><h3>Summary</h3><div class="summary">
<div class="metric"><span>Total Earnings</span><b id="totalEarn">₹0</b></div>
<div class="metric"><span>Driver Salary</span><b id="salary">₹0</b></div>
<div class="metric"><span>Total Expense</span><b id="totalExp">₹0</b></div>
<div class="metric"><span>Owner Balance</span><b id="balance" class="good">₹0</b></div></div>
<div class="actions" style="margin-top:14px"><button id="save">Save Entry</button><button id="share" class="alt">Share</button><button id="logout" class="danger">Logout</button></div>
<div id="saveStatus" class="status"></div></div>

<div class="card"><h3>History</h3><div id="history"><span class="tiny">No entries yet.</span></div></div>
</main></section>


<script>
const FIREBASE_API_KEY = "AIzaSyCw38laQh6qAgGfm0DN8ACcgNxPVtmZUVE";
const FIREBASE_PROJECT_ID = "sst-driver-app";

let mode = "local";
let currentUser = null;
let idToken = null;
let userProfile = {role:"driver"};

const $ = id => document.getElementById(id);
const num = id => Number($(id)?.value || 0);
const money = n => "₹" + Math.round(Number(n)||0).toLocaleString("en-IN");
$("date").value = new Date().toISOString().slice(0,10);

function setLoginStatus(t,bad=false){
  $("loginStatus").textContent=t;
  $("loginStatus").style.color=bad?"#b91c1c":"#166534";
}

async function firebaseLogin(email,password){
  const r = await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(FIREBASE_API_KEY)}`,
    {method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({email,password,returnSecureToken:true})}
  );
  const data = await r.json();
  if(!r.ok) throw new Error(data?.error?.message || "LOGIN_FAILED");
  return data;
}

function encodeValue(v){
  if(typeof v==="number") return {doubleValue:v};
  if(typeof v==="boolean") return {booleanValue:v};
  if(v===null || v===undefined) return {nullValue:null};
  return {stringValue:String(v)};
}
function encodeFields(obj){
  const fields={};
  for(const [k,v] of Object.entries(obj)) fields[k]=encodeValue(v);
  return {fields};
}
function decodeFields(fields={}){
  const o={};
  for(const [k,v] of Object.entries(fields)){
    if("stringValue" in v) o[k]=v.stringValue;
    else if("integerValue" in v) o[k]=Number(v.integerValue);
    else if("doubleValue" in v) o[k]=Number(v.doubleValue);
    else if("booleanValue" in v) o[k]=v.booleanValue;
    else if("timestampValue" in v) o[k]=v.timestampValue;
    else o[k]=null;
  }
  return o;
}

async function firestoreGetDoc(path){
  const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${path}`,
    {headers:{Authorization:`Bearer ${idToken}`}});
  if(r.status===404) return null;
  const d=await r.json();
  if(!r.ok) throw new Error(d?.error?.message || "READ_FAILED");
  return decodeFields(d.fields);
}
async function firestoreAdd(collectionName,obj){
  const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${collectionName}`,
    {method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${idToken}`},
     body:JSON.stringify(encodeFields(obj))});
  const d=await r.json();
  if(!r.ok) throw new Error(d?.error?.message || "WRITE_FAILED");
  return d;
}
async function runQuery(collectionName, uidOnly=true){
  const structuredQuery={
    from:[{collectionId:collectionName}],
    orderBy:[{field:{fieldPath:"date"},direction:"DESCENDING"}],
    limit:50
  };
  if(uidOnly){
    structuredQuery.where={
      fieldFilter:{
        field:{fieldPath:"driverUid"},
        op:"EQUAL",
        value:{stringValue:currentUser.uid}
      }
    };
  }
  const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents:runQuery`,
    {method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${idToken}`},
     body:JSON.stringify({structuredQuery})});
  const d=await r.json();
  if(!r.ok) throw new Error(d?.error?.message || "QUERY_FAILED");
  return d.filter(x=>x.document).map(x=>decodeFields(x.document.fields));
}

$("loginBtn").onclick=async()=>{
  const b=$("loginBtn");
  try{
    const email=$("email").value.trim(), password=$("password").value;
    if(!email||!password){setLoginStatus("Email & Password enter pannunga.",true);return;}
    b.disabled=true;b.textContent="Signing in...";setLoginStatus("Connecting...");
    const data=await firebaseLogin(email,password);
    idToken=data.idToken;
    currentUser={uid:data.localId,email:data.email||email};
    userProfile=await firestoreGetDoc(`users/${currentUser.uid}`) || {role:"driver",name:currentUser.email};
    sessionStorage.setItem("sstToken",idToken);
    sessionStorage.setItem("sstUid",currentUser.uid);
    sessionStorage.setItem("sstEmail",currentUser.email);
    sessionStorage.setItem("sstRole",userProfile.role||"driver");
    $("login").style.display="none";
    $("app").style.display="block";
    await renderHistory();
  }catch(e){
    setLoginStatus("Login failed: "+e.message,true);
    b.disabled=false;b.textContent="Login";
  }
};

$("logout").onclick=()=>{
  sessionStorage.clear();currentUser=null;idToken=null;userProfile={role:"driver"};
  $("app").style.display="none";$("login").style.display="flex";
  $("password").value="";$("loginBtn").disabled=false;$("loginBtn").textContent="Login";
  setLoginStatus("Firebase Authentication");
};

function tab(m){
  mode=m;
  $("localPanel").style.display=m==="local"?"block":"none";
  $("outPanel").style.display=m==="out"?"block":"none";
  $("localTab").className=m==="local"?"":"off";
  $("outTab").className=m==="out"?"":"off";
  calc();
}
$("localTab").onclick=()=>tab("local");
$("outTab").onclick=()=>tab("out");

function calc(){
  let earn,sal,exp,bal;
  if(mode==="local"){
    earn=["uber","ola","rapido","namma","travels"].reduce((a,x)=>a+num(x),0);
    sal=Math.round(earn*num("salaryPct")/100);
    exp=sal+num("fuel")+num("other");
    bal=num("cash")-exp;
  }else{
    earn=num("tripAmount");sal=num("bata");
    exp=sal+num("outFuel")+num("toll")+num("parking")+num("permit")+num("outOther");
    bal=num("outCash")-exp;
  }
  $("totalEarn").textContent=money(earn);
  $("salary").textContent=money(sal);
  $("totalExp").textContent=money(exp);
  $("balance").textContent=money(bal);
  return {earn,sal,exp,bal};
}
document.querySelectorAll("input").forEach(x=>x.addEventListener("input",calc));

function buildEntry(){
  const c=calc();
  const common={
    driverUid:currentUser.uid,
    driverName:$("driver").value,
    vehicleNo:$("vehicle").value,
    date:$("date").value,
    totalEarnings:c.earn,
    driverSalary:c.sal,
    totalExpense:c.exp,
    ownerBalance:c.bal
  };
  if(mode==="local"){
    return {...common,
      uber:num("uber"),ola:num("ola"),rapido:num("rapido"),
      nammaYatri:num("namma"),travelsLocal:num("travels"),
      cashCollection:num("cash"),fuel:num("fuel"),otherExpense:num("other"),
      salaryPercent:num("salaryPct")
    };
  }else{
    return {...common,route:$("route").value,
      tripAmount:num("tripAmount"),cashCollection:num("outCash"),
      bata:num("bata"),fuel:num("outFuel"),toll:num("toll"),
      parking:num("parking"),permit:num("permit"),otherExpense:num("outOther")
    };
  }
}

$("save").onclick=async()=>{
  if(!currentUser){$("saveStatus").textContent="Please login";return;}
  const b=$("save");
  try{
    b.disabled=true;b.textContent="Saving...";
    const collectionName=mode==="local"?"daily_accounts":"outstation_accounts";
    await firestoreAdd(collectionName,buildEntry());
    $("saveStatus").textContent="Cloud saved successfully ✓";
    await renderHistory();
  }catch(e){
    $("saveStatus").textContent="Save failed: "+e.message;
  }finally{
    b.disabled=false;b.textContent="Save Entry";
  }
};

async function renderHistory(){
  if(!currentUser) return;
  $("history").innerHTML='<span class="tiny">Loading cloud history...</span>';
  try{
    const admin=(userProfile.role==="admin");
    const [locals,outs]=await Promise.all([
      runQuery("daily_accounts",!admin),
      runQuery("outstation_accounts",!admin)
    ]);
    const all=[
      ...locals.map(x=>({...x,mode:"local"})),
      ...outs.map(x=>({...x,mode:"out"}))
    ].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).slice(0,50);

    $("history").innerHTML=all.length?all.map(x=>`
      <div class="row">
        <b>${x.date||"-"} · ${x.mode==="local"?"Local / Apps":"Outstation"}</b>
        <div>${x.vehicleNo||""} ${x.route?"· "+x.route:""}</div>
        <div class="tiny">
          ${x.driverName?x.driverName+" · ":""}
          Earnings ${money(x.totalEarnings)} · Expense ${money(x.totalExpense)} · Owner Balance ${money(x.ownerBalance)}
        </div>
      </div>`).join(""):'<span class="tiny">No cloud entries yet.</span>';
  }catch(e){
    $("history").innerHTML=`<span class="tiny">History load failed: ${e.message}</span>`;
  }
}

$("share").onclick=async()=>{
  const x=buildEntry();
  const t=`SST DRIVER ACCOUNT
Date: ${x.date}
Driver: ${x.driverName}
Vehicle: ${x.vehicleNo}
Type: ${mode}
Total Earnings: ${money(x.totalEarnings)}
Driver Salary: ${money(x.driverSalary)}
Total Expense: ${money(x.totalExpense)}
Owner Balance: ${money(x.ownerBalance)}`;
  if(navigator.share) await navigator.share({text:t});
  else {await navigator.clipboard.writeText(t);$("saveStatus").textContent="Account copied ✓";}
};

calc();
</script>
</body></html>
