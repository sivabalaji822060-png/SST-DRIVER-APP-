<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>SST Driver App - Login Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#071426;color:#111}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 60px #0007}
h1{margin:0 0 6px;font-size:30px}.sub{margin-bottom:18px;color:#444;font-size:18px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:14px 13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#0b3a6f;color:#fff;font-size:17px;font-weight:800;margin-top:16px;touch-action:manipulation}
button:disabled{opacity:.65}
.status{margin-top:12px;font-size:13px;min-height:18px}
.ok{color:#166534}.bad{color:#b91c1c}
.success{display:none;text-align:center}
.success h2{margin-top:0}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;margin-top:8px}
.small{font-size:12px;color:#666;margin-top:14px}
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h1>SST Driver App</h1>
  <div class="sub">Cloud Login Test</div>

  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Email">

  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">

  <button id="loginBtn" type="button">Login</button>
  <div id="status" class="status">Ready</div>
  <div class="small">This page tests Firebase Email/Password login only.</div>
</div>

<div class="card success" id="successCard">
  <h2>Login Success ✅</h2>
  <div id="userEmail"></div>
  <div class="badge">Firebase Authentication Working</div>
  <button id="logoutBtn" type="button">Logout</button>
</div>

<script>
const API_KEY = "AIzaSyCw38laQh6qAgGfm0DN8ACcgNxPVtmZUVE";

const emailEl = document.getElementById("email");
const passwordEl = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const statusEl = document.getElementById("status");
const loginCard = document.getElementById("loginCard");
const successCard = document.getElementById("successCard");
const userEmail = document.getElementById("userEmail");
const logoutBtn = document.getElementById("logoutBtn");

function setStatus(text, bad=false){
  statusEl.textContent = text;
  statusEl.className = "status " + (bad ? "bad" : "ok");
}

async function doLogin(){
  const email = emailEl.value.trim();
  const password = passwordEl.value;

  if(!email || !password){
    setStatus("Email and password enter pannunga.", true);
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";
  setStatus("Connecting to Firebase...");

  try{
    const response = await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(API_KEY),
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          email: email,
          password: password,
          returnSecureToken: true
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      const code = data && data.error && data.error.message ? data.error.message : "LOGIN_FAILED";
      throw new Error(code);
    }

    sessionStorage.setItem("sst_idToken", data.idToken);
    sessionStorage.setItem("sst_localId", data.localId);
    sessionStorage.setItem("sst_email", data.email || email);

    userEmail.textContent = data.email || email;
    loginCard.style.display = "none";
    successCard.style.display = "block";
  }catch(err){
    setStatus("Login failed: " + err.message, true);
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
}

function logout(){
  sessionStorage.clear();
  successCard.style.display = "none";
  loginCard.style.display = "block";
  passwordEl.value = "";
  loginBtn.disabled = false;
  loginBtn.textContent = "Login";
  setStatus("Ready");
}

loginBtn.addEventListener("click", doLogin);
logoutBtn.addEventListener("click", logout);

const savedEmail = sessionStorage.getItem("sst_email");
const savedToken = sessionStorage.getItem("sst_idToken");
if(savedEmail && savedToken){
  userEmail.textContent = savedEmail;
  loginCard.style.display = "none";
  successCard.style.display = "block";
}
</script>
</body>
</html>
