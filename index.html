<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SST Driver App</title>
<style>
:root{--navy:#061a2d;--blue:#103f73;--bg:#eef3f8;--card:#fff;--muted:#64748b;--green:#0b7a4b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#132033}
header{background:var(--navy);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:3}header b{font-size:21px}header small{display:block;opacity:.8;margin-top:3px}
main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000012}
h2,h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;display:block;margin:2px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d4dce5;border-radius:11px;font-size:16px;background:#fff}
button{border:0;border-radius:11px;padding:13px 15px;font-size:15px;font-weight:700;background:var(--blue);color:white}button.alt{background:#e7eef6;color:#123}button.danger{background:#a32929}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs .off{background:#dce6f0;color:#334155}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f3f7fb;padding:12px;border-radius:12px}.metric span{font-size:12px;color:var(--muted);display:block}.metric b{font-size:19px}
.good{color:var(--green)}.row{border-top:1px solid #e5e7eb;padding:12px 0}.row:first-child{border-top:0}.tiny{font-size:12px;color:var(--muted)}
#login{min-height:100vh;background:var(--navy);display:flex;align-items:center;padding:24px}.loginbox{background:white;border-radius:22px;padding:22px;width:100%;max-width:440px;margin:auto}
#app{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.status{font-size:13px;margin-top:9px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="login"><div class="loginbox"><h2>SST Driver App</h2><p>Cloud Login</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label style="margin-top:12px">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" style="width:100%;margin-top:16px">Login</button><div id="loginStatus" class="status">Firebase Authentication</div></div></section>

<section id="app"><header><b>Sri Selvam Tours and Travels</b><small>SST Driver Account</small></header><main>
<div class="card"><div class="grid"><div><label>Driver Name</label><input id="driver"></div><div><label>Vehicle No.</label><input id="vehicle" placeholder="TN..."></div><div><label>Date</label><input id="date" type="date"></div><div><label>Salary %</label><input id="salaryPct" type="number" value="35"></div></div></div>
<div class="tabs"><button id="localTab">Local / Apps</button><button id="outTab" class="off">Outstation</button></div>

<div id="localPanel">
<div class="card"><h3>Earnings</h3><div class="grid">
<div><label>Uber ₹</label><input class="earn" id="uber" type="number"></div><div><label>Ola ₹</label><input class="earn" id="ola" type="number"></div>
<div><label>Rapido ₹</label><input class="earn" id="rapido" type="number"></div><div><label>Namma Yatri ₹</label><input class="earn" id="namma" type="number"></div>
<div class="full"><label>Travels Local Package ₹</label><input class="earn" id="travels" type="number"></div>
</div></div>
<div class="card"><h3>Collection & Expenses</h3><div class="grid">
<div><label>Cash Collected ₹</label><input id="cash" type="number"></div><div><label>Fuel / CNG ₹</label><input id="fuel" type="number"></div>
<div class="full"><label>Other Expense ₹</label><input id="other" type="number"></div></div></div>
</div>

<div id="outPanel" style="display:none">
<div class="card"><h3>Outstation Trip</h3><div class="grid">
<div class="full"><label>Trip / Route</label><input id="route"></div><div><label>Trip Amount ₹</label><input id="tripAmount" type="number"></div>
<div><label>Cash Collected ₹</label><input id="outCash" type="number"></div><div><label>Driver Bata / Salary ₹</label><input id="bata" type="number"></div>
<div><label>Fuel ₹</label><input id="outFuel" type="number"></div><div><label>Toll ₹</label><input id="toll" type="number"></div>
<div><label>Parking ₹</label><input id="parking" type="number"></div><div><label>Permit ₹</label><input id="permit" type="number"></div>
<div class="full"><label>Other ₹</label><input id="outOther" type="number"></div></div></div>
</div>

<div class="card"><h3>Summary</h3><div class="summary">
<div class="metric"><span>Total Earnings</span><b id="totalEarn">₹0</b></div>
<div class="metric"><span>Driver Salary</span><b id="salary">₹0</b></div>
<div class="metric"><span>Total Expense</span><b id="totalExp">₹0</b></div>
<div class="metric"><span>Owner Balance</span><b id="balance" class="good">₹0</b></div></div>
<div class="actions" style="margin-top:14px"><button id="save">Save Entry</button><button id="share" class="alt">Share</button><button id="logout" class="danger">Logout</button></div>
<div id="saveStatus" class="status"></div></div>

<div class="card"><h3>History</h3><div id="history"><span class="tiny">No entries yet.</span></div></div>
</main></section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyCw38laQh6qAgGfm0DN8ACcgNxPVtmZUVE",authDomain:"sst-driver-app.firebaseapp.com",projectId:"sst-driver-app",storageBucket:"sst-driver-app.firebasestorage.app",messagingSenderId:"235914188720",appId:"1:235914188720:web:665a024981d800f7c9e875"};
const auth=getAuth(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id), num=id=>Number($(id).value||0), money=n=>"₹"+Math.round(n).toLocaleString("en-IN");
let mode="local";
$("date").value=new Date().toISOString().slice(0,10);

$("loginBtn").onclick=async()=>{ $("loginStatus").textContent="Logging in..."; try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginStatus").textContent="Login Success";}catch(e){$("loginStatus").textContent="Login failed: "+e.code;}};
onAuthStateChanged(auth,u=>{$("login").style.display=u?"none":"flex";$("app").style.display=u?"block":"none"; if(u) renderHistory();});
$("logout").onclick=()=>signOut(auth);

function tab(m){mode=m;$("localPanel").style.display=m==="local"?"block":"none";$("outPanel").style.display=m==="out"?"block":"none";$("localTab").className=m==="local"?"":"off";$("outTab").className=m==="out"?"":"off";calc();}
$("localTab").onclick=()=>tab("local"); $("outTab").onclick=()=>tab("out");

function calc(){
 let earn,sal,exp,bal;
 if(mode==="local"){earn=["uber","ola","rapido","namma","travels"].reduce((a,x)=>a+num(x),0);sal=Math.round(earn*num("salaryPct")/100);exp=sal+num("fuel")+num("other");bal=num("cash")-exp;}
 else{earn=num("tripAmount");sal=num("bata");exp=sal+num("outFuel")+num("toll")+num("parking")+num("permit")+num("outOther");bal=num("outCash")-exp;}
 $("totalEarn").textContent=money(earn);$("salary").textContent=money(sal);$("totalExp").textContent=money(exp);$("balance").textContent=money(bal);
 return {earn,sal,exp,bal};
}
document.querySelectorAll("input").forEach(x=>x.addEventListener("input",calc));

function entry(){
 const c=calc(); return {id:Date.now(),mode,date:$("date").value,driver:$("driver").value,vehicle:$("vehicle").value,route:$("route").value,...c,
 details: mode==="local"?{uber:num("uber"),ola:num("ola"),rapido:num("rapido"),namma:num("namma"),travels:num("travels"),cash:num("cash"),fuel:num("fuel"),other:num("other")}:
 {tripAmount:num("tripAmount"),cash:num("outCash"),bata:num("bata"),fuel:num("outFuel"),toll:num("toll"),parking:num("parking"),permit:num("permit"),other:num("outOther")}}}
function load(){try{return JSON.parse(localStorage.getItem("sst_entries")||"[]")}catch{return []}}
$("save").onclick=()=>{let a=load();a.unshift(entry());localStorage.setItem("sst_entries",JSON.stringify(a));$("saveStatus").textContent="Saved on this device ✓";renderHistory();}
function renderHistory(){let a=load();$("history").innerHTML=a.length?a.slice(0,30).map(x=>`<div class="row"><b>${x.date||"-"} · ${x.mode==="local"?"Local / Apps":"Outstation"}</b><div>${x.vehicle||""} ${x.route?"· "+x.route:""}</div><div class="tiny">Earnings ${money(x.earn)} · Expense ${money(x.exp)} · Owner Balance ${money(x.bal)}</div></div>`).join(""):'<span class="tiny">No entries yet.</span>'}
$("share").onclick=async()=>{let x=entry();let t=`SST DRIVER ACCOUNT\nDate: ${x.date}\nDriver: ${x.driver}\nVehicle: ${x.vehicle}\nType: ${x.mode}\nTotal Earnings: ${money(x.earn)}\nDriver Salary: ${money(x.sal)}\nTotal Expense: ${money(x.exp)}\nOwner Balance: ${money(x.bal)}`;if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$("saveStatus").textContent="Account copied ✓";}};
calc();
</script></body></html>
